# Template for secrets.yaml, only needed for sensair-dev.yaml (the release firmware
# sensair.yaml contains no secrets). Copy to secrets.yaml (git-ignored) and fill in your values.
# In the ESPHome Builder add these under "Secrets" (top right).
wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"
# 32-byte base64 key, e.g. generated by the ESPHome Builder when creating a new device
api_key: "YOUR_API_KEY"
fallback_password: "YOUR_FALLBACK_PASSWORD"
