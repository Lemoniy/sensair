# Connectivity test without any sensors: the ESP should show up in Home Assistant.
# The onboard blue LED (ESP32-C3 SuperMini HW-466AB, GPIO8, inverted: LOW = on)
# appears as a light you can toggle.
# Uses the same device name as sensair.yaml, so flashing sensair.yaml later replaces it over WiFi.

esphome:
  name: sensair
  friendly_name: Sensair

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    # Uploads are encrypted and authenticated with the api encryption key
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Sensair Fallback"
    password: !secret fallback_password

captive_portal:

output:
  - platform: gpio
    id: onboard_led
    pin:
      number: GPIO8
      inverted: true

light:
  - platform: binary
    name: "Status LED"
    output: onboard_led
