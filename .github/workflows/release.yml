# Publishing a GitHub release builds the firmware, attaches it to the release and
# deploys the browser installer (static/index.html + firmware) to GitHub Pages.
#
# Release checklist:
#   1. Set the new version in sensair.yaml (esphome > project > version), commit, push.
#   2. Create a release on GitHub with the tag v<version>, e.g. v0.2.0.
#      The release notes become the update summary shown in Home Assistant.
# One-time setup: Settings > Pages > Source: "GitHub Actions", and allow the tag
# pattern v* under Settings > Environments > github-pages.
#
# Security: the build downloads ESPHome and its libraries, so it runs in its own job
# with read-only access. Only the later jobs, which run no third-party build code, can
# write to the release, sign the provenance attestations and deploy the page.
# Actions are pinned to commit SHAs; Dependabot proposes updates (.github/dependabot.yml).
name: Release

on:
  release:
    types: [published]

permissions: {}

# Never run two Pages deployments at the same time
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in sync with ci.yml and the local ESPHome install
  ESPHOME_VERSION: 2026.9.1

jobs:
  build:
    name: Build firmware and installer site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build sensair.yaml
        id: esphome
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667 # v8.1.0
        with:
          yaml-file: sensair.yaml
          version: ${{ env.ESPHOME_VERSION }}
          complete-manifest: true
          release-summary: ${{ github.event.release.body }}
          release-url: ${{ github.event.release.html_url }}

      - name: Check that the release tag matches the firmware version
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.esphome.outputs.project-version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match the version $VERSION in sensair.yaml"
            exit 1
          fi

      - name: Assemble the installer site
        env:
          NAME: ${{ steps.esphome.outputs.name }}
        run: |
          mkdir -p site/firmware
          cp static/* site/
          cp "$NAME/$NAME.factory.bin" "$NAME/$NAME.ota.bin" site/firmware/
          # Show "Sensair" instead of the project ID in the installer dialog, and offer
          # to erase the flash on a new install (clears old WiFi and API key)
          jq '.name = "Sensair" | .new_install_prompt_erase = true' "$NAME/manifest.json" > site/firmware/manifest.json
          cat site/firmware/manifest.json

      - name: Package the Windows installer
        run: |
          # Point the script at this repository's GitHub Pages manifest
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          url="https://$owner.github.io/${GITHUB_REPOSITORY#*/}/firmware/manifest.json"
          mkdir -p dist/sensair-installer-windows
          cp installer/windows/* dist/sensair-installer-windows/
          sed -i -E "s#https://[^/']+\.github\.io/[^/']+/firmware/manifest\.json#$url#" \
            dist/sensair-installer-windows/install-sensair.ps1
          grep -q "$url" dist/sensair-installer-windows/install-sensair.ps1
          (cd dist && zip -r sensair-installer-windows.zip sensair-installer-windows)
          cp dist/sensair-installer-windows.zip site/

      - name: Hand the files over to the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: site/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    name: Attest and attach files to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # attach the files and checksums to the release
      id-token: write     # sign the attestations (Sigstore)
      attestations: write # store the attestations on GitHub
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: site

      # Signed record that these exact files were built by this workflow from this
      # commit; anyone can check it with "gh attestation verify <file> --repo <repo>"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            site/firmware/*.bin
            site/sensair-installer-windows.zip

      - name: Attach files and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd site && sha256sum firmware/*.bin sensair-installer-windows.zip) | sed 's#firmware/##' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" site/firmware/*.bin site/sensair-installer-windows.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Add checksums and verification hint to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # A re-run must not add the section twice
          if grep -q '^## Checksums' notes.md; then exit 0; fi
          {
            echo
            echo '## Checksums (SHA-256)'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "All files were built by this repository's release workflow. To verify a download:"
            echo
            echo '```'
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
